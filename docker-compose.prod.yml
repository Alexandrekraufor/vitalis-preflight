# Production stack for a VPS: the application, its database, and a one-shot
# migration step. Nothing here binds the database to a public interface, and no
# secret is written in this file.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Reachable only from the compose network. No `ports:` on purpose: the
    # database must never answer on the VPS's public interface.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      VITALIS_API_KEY: ${VITALIS_API_KEY:-}
      VITALIS_MCP_API_KEY: ${VITALIS_MCP_API_KEY:-}
      VITALIS_API_DEMO_MODE: "false"
      OBSERVATION_INTERPRETER: ${OBSERVATION_INTERPRETER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Bound to loopback: the reverse proxy on the host is what faces the world,
    # and it is what terminates TLS.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
