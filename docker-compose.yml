services:
  postgres:
    image: postgres:16-alpine
    container_name: vitalis-preflight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitalis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalis}
      POSTGRES_DB: ${POSTGRES_DB:-vitalis_preflight}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vitalis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalis} -d ${POSTGRES_DB:-vitalis_preflight}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vitalis-postgres-data:
