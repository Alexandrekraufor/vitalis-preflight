# Banco de desenvolvimento local. Sobe com `pnpm db:up`.
#
# Tudo leva o prefixo vitalis- de propósito: esta máquina pode já ter outro
# Postgres rodando, e o nome do serviço vira nome de container e de rede.
services:
  vitalis-postgres:
    image: postgres:16-alpine
    container_name: vitalis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: vitalis
      POSTGRES_DB: vitalis_preflight
    # 5433 no host para não brigar com um Postgres instalado na porta padrão.
    # Banco de desenvolvimento: a senha acima não vale em lugar nenhum além daqui.
    ports:
      - "5433:5432"
    volumes:
      - vitalis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis_preflight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vitalis-postgres-data:
